name: devops-project1-push

on:
  push:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{secrets.DOCKERHUB_USERNAME}}
          password: ${{secrets.DOCKERHUB_TOKEN}}

      - name: Run tests
        run: make ci

      - name: Build Docker image
        run: docker build -t ${{secrets.DOCKERHUB_USERNAME}}/devops-for-developers-project-74:latest .

      - name: Push image to Docker Hub
        run: docker push ${{secrets.DOCKERHUB_USERNAME}}/devops-for-developers-project-74:latest
