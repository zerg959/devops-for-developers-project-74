name: devops-project1-push

on:
  push:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{secrets.DOCKERHUB_USERNAME}}
          password: ${{secrets.DOCKERHUB_TOKEN}}
      
      - name: install Docker Compose
        run: |
          sudo curl -L "https://github.com/docker/compose/releases/download/v2.24.0/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose


      - name: Run tests
        run: make -C ./app ci

      - name: Build Docker image1
        run: docker build -t ${{secrets.DOCKERHUB_USERNAME}}/devops-for-developers-project-74:latest .

      - name: Push image to Docker Hub
        run: docker push ${{secrets.DOCKERHUB_USERNAME}}/devops-for-developers-project-74:latest
